spring.application.name=my-market-app

spring.r2dbc.url=r2dbc:h2:mem:///marketdb
spring.r2dbc.username=sa
spring.r2dbc.password=

logging.level.io.r2dbc.h2.H2Connection=ERROR

spring.data.redis.host=localhost
spring.data.redis.port=6379

payment.service.url=http://localhost:8081

spring.security.oauth2.client.registration.market-app.client-id=market-app
spring.security.oauth2.client.registration.market-app.client-secret=${MARKET_CLIENT_SECRET:market-app-dev-secret}
spring.security.oauth2.client.registration.market-app.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.market-app.token-uri=${KEYCLOAK_REALM_URL:http://localhost:8082/realms/market}/protocol/openid-connect/token
