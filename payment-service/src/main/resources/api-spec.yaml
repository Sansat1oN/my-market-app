openapi: 3.0.3
info:
  title: Payment Service API
  description: API сервиса платежей витрины интернет-магазина
  version: 1.0.0
servers:
  - url: http://localhost:8081
paths:
  /balance:
    get:
      tags:
        - payments
      summary: Получить баланс на счёте
      operationId: getBalance
      responses:
        '200':
          description: Текущий баланс
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
  /payments:
    post:
      tags:
        - payments
      summary: Оплатить заказ (списать сумму с баланса)
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Оплата прошла, возвращается остаток на счёте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '409':
          description: Недостаточно средств, оплата не прошла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Balance:
      type: object
      required:
        - balance
      properties:
        balance:
          type: integer
          format: int64
          description: Баланс на счёте, руб.
    PaymentRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Сумма к оплате, руб.
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Описание ошибки
