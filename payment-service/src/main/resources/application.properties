spring.application.name=payment-service

server.port=8081

payment.balance=1000
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8082/realms/market
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_REALM_URL:${spring.security.oauth2.resourceserver.jwt.issuer-uri}}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=payment-service
