databaseChangeLog:
  - changeSet:
      id: 1
      author: andrey
      changes:
        - createTable:
            tableName: items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: img_path
                  type: VARCHAR(255)
              - column:
                  name: price
                  type: BIGINT
                  constraints:
                    nullable: false
  - changeSet:
      id: 2
      author: andrey
      changes:
        - createTable:
            tableName: cart_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: item_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_cart_items_item
                    references: items(id)
              - column:
                  name: count
                  type: INT
                  constraints:
                    nullable: false
  - changeSet:
      id: 3
      author: andrey
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_items_order
                    references: orders(id)
              - column:
                  name: item_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_items_item
                    references: items(id)
              - column:
                  name: price
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: count
                  type: INT
                  constraints:
                    nullable: false
  - changeSet:
      id: 4
      author: andrey
      changes:
        - loadData:
            tableName: items
            file: db/changelog/items.csv
            separator: ;
            encoding: UTF-8
            columns:
              - column:
                  name: title
                  type: STRING
              - column:
                  name: description
                  type: STRING
              - column:
                  name: img_path
                  type: STRING
              - column:
                  name: price
                  type: NUMERIC
